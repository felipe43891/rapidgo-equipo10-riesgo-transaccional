# Entorno local de RapidGo (Equipo 10, Variante 4: Riesgo transaccional)
#
# Kafka (KRaft) expone dos listeners:
#   - localhost:9092  -> para el producer que corre en tu computador
#   - kafka:29092     -> para otros contenedores (Spark) dentro de la red de Docker
#
# Uso:
#   docker compose up -d kafka                      # solo Kafka
#   docker compose --profile spark up spark-streaming   # Kafka + job de Spark
#
# Pendiente Semana 3: airflow (webserver + scheduler)
services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: rapidgo-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  spark-streaming:
    image: apache/spark:3.5.1-python3
    container_name: rapidgo-spark
    profiles: ["spark"]
    user: root
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./spark:/app/spark
      - ./datalake:/app/datalake
    working_dir: /app
    command: >
      /opt/spark/bin/spark-submit
      --conf spark.jars.ivy=/tmp/.ivy
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
      /app/spark/streaming_job.py
      --bootstrap kafka:29092
      --lake /app/datalake
      --ventana "1 minute"
